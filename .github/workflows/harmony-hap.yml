name: Build HarmonyOS HAP

on:
  push:
    branches: [main]
    paths:
      - 'chat-demo/**'
      - 'harmony/**'
      - '.github/workflows/harmony-hap.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmony-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hap:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chat-demo/pnpm-lock.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev jq

      - name: Setup HarmonyOS CLI Tools
        uses: ErBWs/setup-ohos@v2
        with:
          cache: true

      - name: Build web assets and copy to HarmonyOS rawfile
        working-directory: chat-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ../harmony/entry/src/main/resources/rawfile/web/*
          cp -R dist/* ../harmony/entry/src/main/resources/rawfile/web/

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(node -p "require('./chat-demo/package.json').version")
          fi
          echo "name=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build HarmonyOS HAP
        working-directory: harmony
        run: |
          ohpm install --all
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Collect HAP artifact
        shell: bash
        run: |
          HAP_PATH=$(find harmony/entry/build -name "*.hap" | head -n 1)
          if [ -z "${HAP_PATH}" ]; then
            echo "No .hap file generated"
            exit 1
          fi
          cp "${HAP_PATH}" "Nuwa-v${{ steps.version.outputs.name }}-harmony-unsigned.hap"

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuwa-HarmonyOS-v${{ steps.version.outputs.name }}
          path: Nuwa-*-harmony-unsigned.hap
          if-no-files-found: error

      - name: Attach HAP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Nuwa-*-harmony-unsigned.hap
