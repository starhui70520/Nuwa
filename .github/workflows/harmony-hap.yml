name: Build HarmonyOS HAP

on:
  push:
    branches: [main]
    paths:
      - 'chat-demo/**'
      - 'harmony/**'
      - '.github/workflows/harmony-hap.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmony-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hap:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chat-demo/pnpm-lock.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev jq

      - name: Setup HarmonyOS CLI Tools
        uses: ErBWs/setup-ohos@v2
        with:
          cache: true

      - name: Build web assets and copy to HarmonyOS rawfile
        working-directory: chat-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ../harmony/entry/src/main/resources/rawfile/web/*
          cp -R dist/* ../harmony/entry/src/main/resources/rawfile/web/

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(node -p "require('./chat-demo/package.json').version")
          fi
          echo "name=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build HarmonyOS HAP
        working-directory: harmony
        run: |
          ohpm install --all
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Collect and sign HAP artifact
        shell: bash
        env:
          P12_B64: ${{ secrets.HARMONY_P12_BASE64 }}
          CER_B64: ${{ secrets.HARMONY_CER_BASE64 }}
          P7B_B64: ${{ secrets.HARMONY_P7B_BASE64 }}
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
        run: |
          HAP_PATH=$(find harmony/entry/build -name "*.hap" | head -n 1)
          if [ -z "${HAP_PATH}" ]; then
            echo "No .hap file generated"
            exit 1
          fi

          if [ -n "${P12_B64}" ] && [ -n "${CER_B64}" ] && [ -n "${P7B_B64}" ]; then
            mkdir -p /tmp/harmony-signing
            echo "${P12_B64}" | base64 -d > /tmp/harmony-signing/nuwa.p12
            echo "${CER_B64}" | base64 -d > /tmp/harmony-signing/nuwa.cer
            echo "${P7B_B64}" | base64 -d > /tmp/harmony-signing/nuwa.p7b

            SIGN_TOOL=$(find "${HOS_SDK_HOME:-/}" /opt /home/runner -name "hap-sign-tool.jar" 2>/dev/null | head -n 1)
            if [ -z "${SIGN_TOOL}" ]; then
              echo "hap-sign-tool.jar not found"
              exit 1
            fi

            java -jar "${SIGN_TOOL}" sign-app \
              -mode localSign \
              -signAlg SHA256withECDSA \
              -keyAlias "${HARMONY_KEY_ALIAS}" \
              -inFile "${HAP_PATH}" \
              -outFile "Nuwa-v${{ steps.version.outputs.name }}-harmony-signed.hap" \
              -keystoreFile /tmp/harmony-signing/nuwa.p12 \
              -keystorePwd "${HARMONY_KEYSTORE_PASSWORD}" \
              -keyPwd "${HARMONY_KEY_PASSWORD}" \
              -appCertFile /tmp/harmony-signing/nuwa.cer \
              -profileFile /tmp/harmony-signing/nuwa.p7b \
              -signCode 1
          else
            cp "${HAP_PATH}" "Nuwa-v${{ steps.version.outputs.name }}-harmony-unsigned.hap"
          fi

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuwa-HarmonyOS-v${{ steps.version.outputs.name }}
          path: Nuwa-*-harmony-*.hap
          if-no-files-found: error

      - name: Attach HAP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Nuwa-*-harmony-*.hap
