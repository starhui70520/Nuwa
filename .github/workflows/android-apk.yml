name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'chat-demo/**'
      - '.github/workflows/android-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chat-demo/pnpm-lock.yaml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        working-directory: chat-demo
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        working-directory: chat-demo
        run: |
          pnpm type
          pnpm lint

      - name: Build web assets & sync Capacitor
        working-directory: chat-demo
        run: |
          pnpm build
          npx cap sync android

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(node -p "require('./chat-demo/package.json').version")
          fi
          echo "name=${VER}" >> "$GITHUB_OUTPUT"
          echo "NUWA_VERSION_NAME=${VER}" >> "$GITHUB_ENV"

      - name: Build Android APK
        working-directory: chat-demo/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NUWA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NUWA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NUWA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          XIAOMI_MICT_APP_ID: ${{ secrets.XIAOMI_MICT_APP_ID }}
        run: |
          chmod +x ./gradlew
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > /tmp/nuwa-release.keystore
            export NUWA_KEYSTORE_FILE="/tmp/nuwa-release.keystore"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "${GITHUB_WORKSPACE}/Nuwa-v${{ steps.version.outputs.name }}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "${GITHUB_WORKSPACE}/Nuwa-v${{ steps.version.outputs.name }}-debug.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuwa-APK-v${{ steps.version.outputs.name }}
          path: Nuwa-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Nuwa-*.apk

      - name: Push APK to Nuwa Portal (MinIO)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NUWA_PORTAL_TOKEN: ${{ secrets.NUWA_PORTAL_TOKEN }}
          NUWA_PORTAL_URL: ${{ vars.NUWA_PORTAL_URL || 'https://dl.rankchord.com' }}
        run: |
          if [ -z "${NUWA_PORTAL_TOKEN}" ]; then
            echo "NUWA_PORTAL_TOKEN not set, skipping upload."
            exit 0
          fi
          VER="${{ steps.version.outputs.name }}"
          CHANGELOG=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_BODY=$(git tag -l --format='%(contents:body)' "${TAG_NAME}" | sed -e 's/[[:space:]]*$//')
            TAG_SUBJECT=$(git tag -l --format='%(contents:subject)' "${TAG_NAME}" | sed -e 's/[[:space:]]*$//')
            if [ -n "${TAG_BODY}" ]; then
              CHANGELOG="${TAG_BODY}"
            elif [ -n "${TAG_SUBJECT}" ] && [ "${TAG_SUBJECT}" != "${TAG_NAME}" ] && [ "${TAG_SUBJECT}" != "${VER}" ]; then
              CHANGELOG="${TAG_SUBJECT}"
            fi
          fi
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="Nuwa v${VER} 自动构建发布"
          fi
          APK_FILE=$(ls Nuwa-*.apk | head -n 1)
          curl -fsSL -X POST "${NUWA_PORTAL_URL}/api/admin/releases" \
            -H "Authorization: Bearer ${NUWA_PORTAL_TOKEN}" \
            -F "platform=android" \
            -F "version=${VER}" \
            -F "versionCode=${{ github.run_number }}" \
            -F "isLatest=true" \
            -F "published=true" \
            -F "changelog=${CHANGELOG}" \
            -F "file=@${APK_FILE}"
