name: Build Native iOS IPA & TestFlight

on:
  push:
    branches: [release/ios-testflight-0.1.35-from-0.1.38]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload signed IPA to TestFlight (requires signing secrets)'
        required: false
        default: true
        type: boolean
      distribute_external:
        description: 'Attach build to External TestFlight group & submit for Beta Review'
        required: false
        default: true
        type: boolean
      external_group:
        description: 'External TestFlight group name(s), comma-separated (blank = all external groups)'
        required: false
        default: ''
        type: string
      whats_new:
        description: 'TestFlight "What to Test" notes (blank = git tag notes / default)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & generate Nuwa.xcodeproj
        working-directory: ios
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/release/ios-testflight-0.1.35-from-0.1.38 || \
                "$(node -p "require('./chat-demo/package.json').version")" != 0.1.38 || \
                "${GITHUB_RUN_NUMBER}" -le 132 ]]; then
            echo "::error::Expected the 0.1.38 release branch source and a build number greater than 132"
            exit 1
          fi
          echo "name=0.1.35" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Build log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ] && [ -n "$IOS_APPSTORE_PROFILE_BASE64" ] && [ -n "$IOS_SHARE_EXTENSION_PROFILE_BASE64" ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$APPSTORE_API_KEY_ID" ] && [ -n "$APPSTORE_API_ISSUER_ID" ] && [ -n "$APPSTORE_API_KEY_P8_BASE64" ]; then
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned native iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -project Nuwa.xcodeproj \
            -scheme Nuwa \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/ios/Build/Products/Release-iphoneos/Nuwa.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "Nuwa.app not found at ${APP_PATH}"
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/Nuwa.app
          cd build
          zip -qry "${GITHUB_WORKSPACE}/Nuwa-v${{ steps.version.outputs.name }}-unsigned.ipa" Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuwa-iOS-v${{ steps.version.outputs.name }}-unsigned
          path: Nuwa-*-unsigned.ipa
          if-no-files-found: error

      - name: Attach Unsigned IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Nuwa-*-unsigned.ipa

      - name: Install Apple Distribution certificate & provisioning profile
        if: steps.signing.outputs.can_sign == 'true'
        id: apple_cert
        shell: bash
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASS="ci-temp-keychain-pass"
          CERT_PATH="${RUNNER_TEMP}/dist.p12"
          PROFILE_PATH="${RUNNER_TEMP}/appstore.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          SHARE_PROFILE_PATH="${RUNNER_TEMP}/share_appstore.mobileprovision"
          SHARE_PROFILE_PLIST="${RUNNER_TEMP}/share_profile.plist"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          echo "$IOS_SHARE_EXTENSION_PROFILE_BASE64" | base64 --decode > "$SHARE_PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          BUNDLE_ID="${APP_ID#${TEAM_ID}.}"

          security cms -D -i "$SHARE_PROFILE_PATH" > "$SHARE_PROFILE_PLIST"
          SHARE_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$SHARE_PROFILE_PLIST")
          SHARE_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$SHARE_PROFILE_PLIST")
          SHARE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$SHARE_PROFILE_PLIST")
          SHARE_BUNDLE_ID="${SHARE_APP_ID#${TEAM_ID}.}"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${PROFILE_UUID}.mobileprovision"
          cp "$SHARE_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${SHARE_PROFILE_UUID}.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "profile_uuid=${PROFILE_UUID}" >> "$GITHUB_OUTPUT"
          echo "profile_name=${PROFILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "team_id=${TEAM_ID}" >> "$GITHUB_OUTPUT"
          echo "bundle_id=${BUNDLE_ID}" >> "$GITHUB_OUTPUT"
          echo "share_profile_name=${SHARE_PROFILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "share_bundle_id=${SHARE_BUNDLE_ID}" >> "$GITHUB_OUTPUT"

      - name: Archive & export signed App Store IPA
        if: steps.signing.outputs.can_sign == 'true'
        working-directory: ios
        shell: bash
        env:
          TEAM_ID: ${{ steps.apple_cert.outputs.team_id }}
          PROFILE_NAME: ${{ steps.apple_cert.outputs.profile_name }}
          BUNDLE_ID: ${{ steps.apple_cert.outputs.bundle_id }}
          SHARE_PROFILE_NAME: ${{ steps.apple_cert.outputs.share_profile_name }}
          SHARE_BUNDLE_ID: ${{ steps.apple_cert.outputs.share_bundle_id }}
        run: |
          xcodebuild \
            -project Nuwa.xcodeproj \
            -scheme Nuwa \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Nuwa.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            NUWA_APP_BUNDLE_ID="$BUNDLE_ID" \
            NUWA_APP_PROFILE="$PROFILE_NAME" \
            NUWA_SHARE_BUNDLE_ID="$SHARE_BUNDLE_ID" \
            NUWA_SHARE_PROFILE="$SHARE_PROFILE_NAME" \
            archive

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
              <key>${SHARE_BUNDLE_ID}</key>
              <string>${SHARE_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Nuwa.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

          IPA_FILE=$(find build/export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "Exported IPA not found"
            exit 1
          fi
          cp "$IPA_FILE" "${GITHUB_WORKSPACE}/Nuwa-v${{ steps.version.outputs.name }}-appstore.ipa"

      - name: Verify signed app and extension versions
        if: steps.signing.outputs.can_sign == 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          IPA="${GITHUB_WORKSPACE}/Nuwa-v${APP_VERSION}-appstore.ipa"
          for PLIST in 'Payload/Nuwa.app/Info.plist' 'Payload/Nuwa.app/PlugIns/NuwaShareExtension.appex/Info.plist'; do
            VERSION=$(unzip -p "$IPA" "$PLIST" | plutil -extract CFBundleShortVersionString raw -o - -)
            BUILD=$(unzip -p "$IPA" "$PLIST" | plutil -extract CFBundleVersion raw -o - -)
            [[ "$VERSION" == "$APP_VERSION" && "$BUILD" == "$BUILD_NUMBER" ]]
            echo "$PLIST: ${VERSION} (${BUILD})"
          done

      - name: Upload to TestFlight (App Store Connect)
        if: |
          steps.signing.outputs.can_sign == 'true' &&
          steps.signing.outputs.can_upload == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.upload_testflight != false)
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "${GITHUB_WORKSPACE}/Nuwa-v${{ steps.version.outputs.name }}-appstore.ipa" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Distribute to External TestFlight & submit Beta Review
        if: |
          steps.signing.outputs.can_sign == 'true' &&
          steps.signing.outputs.can_upload == 'true' &&
          (
            github.ref == 'refs/heads/release/ios-testflight-0.1.35-from-0.1.38' ||
            (github.event_name == 'workflow_dispatch' && inputs.upload_testflight != false && inputs.distribute_external == true)
          )
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          BUNDLE_ID: ${{ steps.apple_cert.outputs.bundle_id }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ inputs.external_group || '外部测试' }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new || '' }}
        run: |
          WHATS_NEW="${INPUT_WHATS_NEW}"
          if [ -z "${WHATS_NEW}" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_BODY=$(git tag -l --format='%(contents:body)' "${TAG_NAME}" | sed -e 's/[[:space:]]*$//')
            TAG_SUBJECT=$(git tag -l --format='%(contents:subject)' "${TAG_NAME}" | sed -e 's/[[:space:]]*$//')
            if [ -n "${TAG_BODY}" ]; then
              WHATS_NEW="${TAG_BODY}"
            elif [ -n "${TAG_SUBJECT}" ] && [ "${TAG_SUBJECT}" != "${TAG_NAME}" ]; then
              WHATS_NEW="${TAG_SUBJECT}"
            fi
          fi
          if [ -z "${WHATS_NEW}" ]; then
            WHATS_NEW="基于 Nuwa 0.1.38 源码的 iOS 测试构建。请验证覆盖安装后的历史会话、输入框按压反馈与点击空白收起键盘。"
          fi
          export TESTFLIGHT_WHATS_NEW="${WHATS_NEW}"
          export APPSTORE_API_KEY_P8_PATH="${HOME}/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          node .github/scripts/distribute-testflight-external.mjs

      - name: Clean up signing keychain and keys
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
          rm -f "${RUNNER_TEMP}/dist.p12" "${RUNNER_TEMP}/appstore.mobileprovision" "${RUNNER_TEMP}/profile.plist" "${RUNNER_TEMP}/share_appstore.mobileprovision" "${RUNNER_TEMP}/share_profile.plist"
