name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
    paths:
      - 'chat-demo/**'
      - '.github/workflows/ios-ipa.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chat-demo/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: chat-demo
        run: pnpm install --frozen-lockfile

      - name: Build web assets & prepare Capacitor iOS
        working-directory: chat-demo
        run: |
          pnpm build
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(node -p "require('./chat-demo/package.json').version")
          fi
          echo "name=${VER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        working-directory: chat-demo
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARGS="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARGS="-project ios/App/App.xcodeproj"
          fi

          xcodebuild \
            ${TARGET_ARGS} \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: chat-demo
        run: |
          APP_PATH="build/ios/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "App.app not found at ${APP_PATH}"
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/App.app
          cd build
          zip -qry "${GITHUB_WORKSPACE}/Nuwa-v${{ steps.version.outputs.name }}-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuwa-iOS-v${{ steps.version.outputs.name }}-unsigned
          path: Nuwa-*-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Nuwa-*-unsigned.ipa
