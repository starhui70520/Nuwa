name: Upload HarmonyOS test package

on:
  push:
    branches: [main]
    paths:
      - 'chat-demo/**'
      - 'harmony/**'
      - '.github/workflows/huawei-test-upload.yml'
      - '.github/scripts/upload-huawei-test-package.mjs'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      submit_invite_test:
        description: 'Create HarmonyOS invite-test version, bind test group(s), and submit for review'
        required: false
        default: true
        type: boolean
      onshelf_self_detect:
        description: 'Enable Huawei full on-shelf self-check (off = faster invite-test review)'
        required: false
        default: false
        type: boolean
      test_group:
        description: 'Huawei test group name(s), comma-separated (blank = all external groups)'
        required: false
        default: ''
        type: string
      test_desc:
        description: 'Test version description, max 50 chars (blank = tag/version summary)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Optional HarmonyOS versionCode override (blank = use app.json5 versionCode)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: huawei-test-upload
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload-test-package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: huawei-test
    env:
      REQUESTED_VERSION_CODE: ${{ inputs.version_code || '' }}

    steps:
      - name: Check Huawei test environment configuration
        env:
          HUAWEI_APP_ID: ${{ vars.HUAWEI_APP_ID }}
          HUAWEI_CHINESE_MAINLAND_FLAG: ${{ vars.HUAWEI_CHINESE_MAINLAND_FLAG || '1' }}
          HAS_HUAWEI_RELEASE_P12_BASE64: ${{ secrets.HUAWEI_RELEASE_P12_BASE64 != '' }}
          HAS_HUAWEI_RELEASE_CER_BASE64: ${{ secrets.HUAWEI_RELEASE_CER_BASE64 != '' }}
          HAS_HUAWEI_RELEASE_P7B_BASE64: ${{ secrets.HUAWEI_RELEASE_P7B_BASE64 != '' }}
          HAS_HUAWEI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HUAWEI_RELEASE_KEYSTORE_PASSWORD != '' }}
          HAS_HUAWEI_RELEASE_KEY_ALIAS: ${{ secrets.HUAWEI_RELEASE_KEY_ALIAS != '' }}
          HAS_HUAWEI_RELEASE_KEY_PASSWORD: ${{ secrets.HUAWEI_RELEASE_KEY_PASSWORD != '' }}
          HAS_HUAWEI_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          missing=0
          for secret in HUAWEI_RELEASE_{P12_BASE64,CER_BASE64,P7B_BASE64,KEYSTORE_PASSWORD,KEY_ALIAS,KEY_PASSWORD} HUAWEI_SERVICE_ACCOUNT_JSON; do
            check="HAS_$secret"
            if [[ "${!check}" != true ]]; then
              echo "::error::Configure the $secret secret in the huawei-test GitHub environment."
              missing=1
            fi
          done
          if [[ ! "$HUAWEI_APP_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Set HUAWEI_APP_ID to the numeric AppGallery application ID in the huawei-test GitHub environment.'
            missing=1
          fi
          if [[ "$HUAWEI_CHINESE_MAINLAND_FLAG" != 0 && "$HUAWEI_CHINESE_MAINLAND_FLAG" != 1 ]]; then
            echo '::error::HUAWEI_CHINESE_MAINLAND_FLAG must be 0 or 1.'
            missing=1
          fi
          exit "$missing"

      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chat-demo/pnpm-lock.yaml

      - name: Configure version code and unsigned APP build
        id: build-config
        run: |
          echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs'

          const appPath = 'harmony/AppScope/app.json5'
          const appConfig = JSON.parse(readFileSync(appPath, 'utf8'))
          const repositoryVersionCode = appConfig.app.versionCode
          const isValidVersionCode = (code) => Number.isInteger(code) && code > 0 && code <= 2147483647
          if (!isValidVersionCode(repositoryVersionCode)) {
            throw new Error('The repository versionCode must be an integer from 1 to 2147483647.')
          }

          const requestedCode = (process.env.REQUESTED_VERSION_CODE ?? '').trim()
          const hasRequestedCode = requestedCode.length > 0
          const versionCode = hasRequestedCode ? Number(requestedCode) : repositoryVersionCode
          if (hasRequestedCode && (!/^[1-9][0-9]{0,9}$/.test(requestedCode) || !isValidVersionCode(versionCode))) {
            throw new Error('version_code must be an integer from 1 to 2147483647.')
          }
          if (versionCode < repositoryVersionCode) {
            throw new Error(`version_code must be at least the repository versionCode (${repositoryVersionCode}).`)
          }

          const ref = process.env.GITHUB_REF ?? ''
          if (ref.startsWith('refs/tags/v')) {
            appConfig.app.versionName = ref.slice('refs/tags/v'.length)
          }

          // Distinguish each test build cleanly using buildVersion unless an explicit higher versionCode was supplied.
          let packageLabel = String(versionCode)
          if (!hasRequestedCode || versionCode === repositoryVersionCode) {
            const buildVersion = `${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`
            if (!/^[1-9][0-9]*\.[1-9][0-9]*$/.test(buildVersion) || buildVersion.length > 18) {
              throw new Error('Cannot derive a valid HarmonyOS buildVersion from this Actions run.')
            }
            appConfig.app.buildVersion = buildVersion
            packageLabel += `-${buildVersion}`
          }
          appConfig.app.versionCode = versionCode
          writeFileSync(appPath, `${JSON.stringify(appConfig, null, 2)}\n`)
          appendFileSync(process.env.GITHUB_ENV, `TEST_PACKAGE_LABEL=${packageLabel}\n`)
          appendFileSync(process.env.GITHUB_ENV, `RESOLVED_VERSION_NAME=${appConfig.app.versionName}\n`)

          const profilePath = 'harmony/build-profile.json5'
          const profile = JSON.parse(readFileSync(profilePath, 'utf8'))
          const product = profile.app.products.find(({ name }) => name === 'default')
          if (!product) throw new Error('Cannot find the default HarmonyOS product')
          delete product.signingConfig
          product.buildOption ??= {}
          product.buildOption.packOptions ??= {}
          product.buildOption.packOptions.buildAppSkipSignHap = true
          writeFileSync(profilePath, `${JSON.stringify(profile, null, 2)}\n`)
          NODE

      - name: Check dependencies and stage native Markdown runtimes
        working-directory: chat-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm type
          pnpm lint
          node ../harmony/scripts/stage-mermaid.mjs
          node ../harmony/scripts/stage-katex.mjs
          node ../harmony/scripts/stage-prism.mjs
          node ../harmony/scripts/stage-markdown.mjs
          node ../harmony/scripts/stage-legacy-migration.mjs

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install HarmonyOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev jq

      - name: Set up HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Build release APP pack
        working-directory: harmony
        env:
          NODE_24: ${{ steps.build-config.outputs.node }}
        run: |
          "$NODE_24" scripts/prepare-offline-english.mjs
          ohpm install --all
          hvigorw assembleApp --mode project -p product=default -p buildMode=release --no-daemon

      - name: Sign and verify release APP pack
        env:
          HUAWEI_RELEASE_P12_BASE64: ${{ secrets.HUAWEI_RELEASE_P12_BASE64 }}
          HUAWEI_RELEASE_CER_BASE64: ${{ secrets.HUAWEI_RELEASE_CER_BASE64 }}
          HUAWEI_RELEASE_P7B_BASE64: ${{ secrets.HUAWEI_RELEASE_P7B_BASE64 }}
          HUAWEI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HUAWEI_RELEASE_KEYSTORE_PASSWORD }}
          HUAWEI_RELEASE_KEY_ALIAS: ${{ secrets.HUAWEI_RELEASE_KEY_ALIAS }}
          HUAWEI_RELEASE_KEY_PASSWORD: ${{ secrets.HUAWEI_RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/nuwa-signing.XXXXXX")
          signed_app="$RUNNER_TEMP/Nuwa-HarmonyOS-${TEST_PACKAGE_LABEL}-signed.app"
          verified=false
          cleanup() {
            rm -rf -- "$signing_dir"
            if [[ "$verified" != true ]]; then
              rm -f -- "$signed_app"
            fi
          }
          trap cleanup EXIT

          printf '%s' "$HUAWEI_RELEASE_P12_BASE64" | base64 --decode > "$signing_dir/release.p12"
          printf '%s' "$HUAWEI_RELEASE_CER_BASE64" | base64 --decode > "$signing_dir/release.cer"
          printf '%s' "$HUAWEI_RELEASE_P7B_BASE64" | base64 --decode > "$signing_dir/release.p7b"

          shopt -s nullglob
          app_packs=(harmony/build/outputs/default/*.app)
          if (( ${#app_packs[@]} != 1 )); then
            echo '::error::Expected exactly one HarmonyOS APP pack in the default product output.'
            exit 1
          fi
          sign_tool="${OHOS_NDK_HOME:-}/toolchains/lib/hap-sign-tool.jar"
          if [[ ! -f "$sign_tool" && -n "${HOS_SDK_HOME:-}" ]]; then
            sign_tool="$HOS_SDK_HOME/default/openharmony/toolchains/lib/hap-sign-tool.jar"
          fi
          if [[ ! -f "$sign_tool" ]]; then
            echo '::error::Cannot find the SDK signing tool.'
            exit 1
          fi

          # The signing tool's log can include sensitive signing arguments.
          if ! java -jar "$sign_tool" sign-app \
            -mode localSign -signAlg SHA256withECDSA \
            -keyAlias "$HUAWEI_RELEASE_KEY_ALIAS" \
            -inFile "${app_packs[0]}" -outFile "$signed_app" \
            -keystoreFile "$signing_dir/release.p12" \
            -keystorePwd "$HUAWEI_RELEASE_KEYSTORE_PASSWORD" \
            -keyPwd "$HUAWEI_RELEASE_KEY_PASSWORD" \
            -appCertFile "$signing_dir/release.cer" \
            -profileFile "$signing_dir/release.p7b" > "$signing_dir/sign.log" 2>&1 || [[ ! -s "$signed_app" ]]; then
            echo '::error::APP signing failed. Check the release signing files, key alias, and passwords.'
            exit 1
          fi

          if ! java -jar "$sign_tool" verify-app \
            -inFile "$signed_app" \
            -outCertChain "$signing_dir/verified.cer" \
            -outProfile "$signing_dir/verified.p7b" > "$signing_dir/verify.log" 2>&1 ||
            [[ ! -s "$signing_dir/verified.cer" || ! -s "$signing_dir/verified.p7b" ]]; then
            echo '::error::The signed APP did not pass signature verification.'
            exit 1
          fi
          verified=true

      - name: Upload to the Huawei testing area
        env:
          NODE_24: ${{ steps.build-config.outputs.node }}
          HUAWEI_APP_ID: ${{ vars.HUAWEI_APP_ID }}
          HUAWEI_CHINESE_MAINLAND_FLAG: ${{ vars.HUAWEI_CHINESE_MAINLAND_FLAG || '1' }}
          HUAWEI_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_SERVICE_ACCOUNT_JSON }}
          HUAWEI_TEST_GROUP: ${{ inputs.test_group || vars.HUAWEI_TEST_GROUP || '' }}
          HUAWEI_ONSHELF_SELF_DETECT: ${{ inputs.onshelf_self_detect == true && '1' || '0' }}
          INPUT_TEST_DESC: ${{ inputs.test_desc || '' }}
          INPUT_SUBMIT_INVITE_TEST: ${{ inputs.submit_invite_test }}
        run: |
          signed_app="$RUNNER_TEMP/Nuwa-HarmonyOS-${TEST_PACKAGE_LABEL}-signed.app"
          trap 'rm -f -- "$signed_app"' EXIT

          SUBMIT_INVITE="false"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SUBMIT_INVITE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_SUBMIT_INVITE_TEST}" != "false" ]]; then
            SUBMIT_INVITE="true"
          fi

          TEST_DESC="${INPUT_TEST_DESC}"
          if [[ -z "${TEST_DESC}" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_SUBJECT=$(git tag -l --format='%(contents:subject)' "${TAG_NAME}" | tr '\r\n' ' ' | sed -e 's/[[:space:]]*$//')
            if [[ -n "${TAG_SUBJECT}" && "${TAG_SUBJECT}" != "${TAG_NAME}" ]]; then
              TEST_DESC="${TAG_SUBJECT}"
            fi
          fi
          if [[ -z "${TEST_DESC}" ]]; then
            TEST_DESC="Nuwa v${RESOLVED_VERSION_NAME} 邀请测试"
          fi

          HUAWEI_SUBMIT_INVITE_TEST="${SUBMIT_INVITE}" \
          HUAWEI_TEST_DESC="${TEST_DESC}" \
          "$NODE_24" .github/scripts/upload-huawei-test-package.mjs "$signed_app"

          {
            printf '### Huawei testing area\n\n'
            printf '%s\n' "- Package: \`$(basename "$signed_app")\`"
            printf '%s\n' '- Huawei package analysis: passed'
            if [[ "${SUBMIT_INVITE}" != "true" ]]; then
              printf '%s\n' '- Invite-test submission: skipped on main branch push (enabled on v* tags or workflow_dispatch)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
