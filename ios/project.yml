name: Nuwa
options:
  bundleIdPrefix: com.rankchord
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.35"
    CURRENT_PROJECT_VERSION: "1"
    NUWA_APP_BUNDLE_ID: com.rankchord.nuwa
    NUWA_APP_PROFILE: ""
    NUWA_SHARE_BUNDLE_ID: com.rankchord.nuwa.share
    NUWA_SHARE_PROFILE: ""

targets:
  Nuwa:
    type: application
    platform: iOS
    sources:
      - path: Nuwa
        excludes:
          - "*.entitlements"
      - path: Shared
    entitlements:
      path: Nuwa/Nuwa.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rankchord.nuwa
    info:
      path: Nuwa/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: Nuwa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUserActivityTypes:
          - INSendMessageIntent
        CFBundleURLTypes:
          - CFBundleURLName: com.rankchord.nuwa
            CFBundleURLSchemes:
              - nuwa
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nuwa Chat Session
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.rankchord.nuwa.session
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
          - CFBundleTypeName: JSON Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rankchord.nuwa.session
            UTTypeDescription: Nuwa Chat Session
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - nuwa
              public.mime-type:
                - application/vnd.nuwa.session+zip
        NSMicrophoneUsageDescription: 用于语音输入，将语音转写为文字发送给助手
        NSSpeechRecognitionUsageDescription: 用于语音输入，在设备上进行语音识别
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: NuwaShareExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Nuwa
        INFOPLIST_KEY_CFBundleDisplayName: Nuwa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: $(NUWA_APP_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(NUWA_APP_PROFILE)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []

  NuwaShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NuwaShareExtension
        excludes:
          - "*.entitlements"
      - path: Shared
    entitlements:
      path: NuwaShareExtension/NuwaShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rankchord.nuwa
    info:
      path: NuwaShareExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: Nuwa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: NuwaShareExtension
        PRODUCT_MODULE_NAME: NuwaShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(NUWA_SHARE_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(NUWA_SHARE_PROFILE)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
