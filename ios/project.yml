name: Nuwa
options:
  bundleIdPrefix: com.rankchord
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "0.1.31"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Nuwa
    INFOPLIST_KEY_CFBundleDisplayName: Nuwa

targets:
  Nuwa:
    type: application
    platform: iOS
    sources:
      - path: Nuwa
    info:
      path: Nuwa/Info.plist
      properties:
        CFBundleDisplayName: Nuwa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nuwa Chat Session
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.rankchord.nuwa.session
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
          - CFBundleTypeName: JSON Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rankchord.nuwa.session
            UTTypeDescription: Nuwa Chat Session
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - nuwa
              public.mime-type:
                - application/vnd.nuwa.session+zip
        NSMicrophoneUsageDescription: 用于语音输入，将语音转写为文字发送给助手
        NSSpeechRecognitionUsageDescription: 用于语音输入，在设备上进行语音识别
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rankchord.nuwa
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
