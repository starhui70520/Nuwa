<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        color: #1f2329;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 8px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #fff;
        color: #1f2329;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
      }
      .btn-primary {
        border-color: #4d6bfe;
        background: #4d6bfe;
        color: #fff;
      }
      .status {
        margin-top: 8px;
        padding: 8px;
        border-radius: 6px;
        background: #f6f8fa;
        font-size: 12px;
        color: #57606a;
        line-height: 1.4;
      }
      input[type='file'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h3>Nuwa 历史迁移助手</h3>
    <button id="openDs" class="btn btn-primary">1. 前往 DeepSeek 导出数据</button>
    <button id="pickZip" class="btn">2. 选择本地 .zip 一键推送到 Nuwa</button>
    <button id="openApp" class="btn">打开本地 Nuwa</button>
    <input id="fileInput" type="file" accept=".zip" />
    <div id="status" class="status">
      在 DeepSeek 网页点击「导出数据」后，若已开启“允许访问文件网址”，插件会自动推送到 Nuwa。
    </div>
    <script src="popup.js"></script>
  </body>
</html>
